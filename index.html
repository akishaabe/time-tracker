<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OJT Time Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
</head>
<body>
    <h1> OJT Time Tracker </h1>

    <div class="card">
        <label> Required OJT Hours:</label>
        <input type="number" id="requiredHours" placeholder="e.g. 400">
        <button onclick="saveRequiredHours()"> Save </button>
    </div>

    <div class="card">
        <p> Completed Hours: <span id="completed">0</span> </p>
        <p> Remaining Hours: <span id="remaining">0</span> </p>
        <button onclick="startDuty()">▶ Start Duty" </button>
        <button onclick="endDuty()">■ End Duty" </button>
    </div>

    <div class="card">
        <canvas id="timeChart"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
